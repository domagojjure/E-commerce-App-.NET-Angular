<div class="table-responsive" *ngIf="(basketService.basketSource$ | async) as basket">
    <table class="table">
        <thead class="text-uppercase" [class.bg-light]="isBasket">
            <tr>
                <th >
                    <div class="p-2 px-3 text-uppercase">Product</div>
                </th>
                <th >
                    <div class="py-2 text-uppercase">Price</div>
                </th>
                <th [class.text-center]="!isBasket"> <!-- scope="col" class="border-0 bg-light"-->
                    <div class="py-2 text-uppercase">Quantity</div>
                </th>
                <th scope="col" class="border-0 bg-light">
                    <div class="py-2 text-uppercase">Total</div>
                </th>
                <th scope="col" class="border-0 bg-light">
                    <div class="py-2 text-uppercase">Remove</div>
                </th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of basket.items">
                <th scope="row">
                    <div class="p-2 d-inline-block">
                        <img src="{{item.pictureUrl}}" alt="{{item.productName}}"
                            class="img-fluid" style="max-height: 50px;">
                        <div class="ml-3 d-inline-block align-middle">
                            <h5 class="mb-0">
                                <a routerLink="/shop/{{item.id}}"
                                    class="text-dark">{{item.productName}}</a>
                            </h5>
                            <span
                                class="text-muted font-weight-normal font-italic d-block">Type:
                                {{item.type}}</span>
                        </div>

                    </div>
                </th>
                <td class="align-middle"><strong>{{item.price | currency}}</strong></td>
                <td class="align-middle">
                    <div class="d-flex align-items-center" [class.justify-content-center]="!isBasket">
                        <i *ngIf="isBasket" (click)="removeBasketItem(item.id,1)"
                            class="fa fa-minus-circle text-warning mr-2"
                            style="cursor: pointer; font-size: 2em;"></i>
                        <span class="font-weight-bold" style="font-size: 1.2em;">
                            {{item.quantity}}
                        </span>
                        <i *ngIf="isBasket" (click)="addBasketItem(item)"
                            class="fa fa-plus-circle text-warning mx-2"
                            style="cursor: pointer; font-size: 2em;"></i>
                    </div>
                </td>
                <td class="align-middle">
                    <strong>{{item.price * item.quantity | currency}}</strong>
                </td>
                <td class="align-middle" *ngIf="isBasket">
                    <a class="text-danger">

                        <i  (click)="removeBasketItem(item.id,item.quantity)" class="fa fa-trash"
                            style="font-size: 2em; cursor: pointer;"></i>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
