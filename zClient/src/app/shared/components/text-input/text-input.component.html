<div class="form-floating mb-3">
    <input  type={{type}}
     [formControl]="control" 
     class="form-control"
     placeholder="{{label}}"
     [ngClass]="(control.touched) ? control.invalid ? 'is-invalid' : 'is-valid':null "
     >
     <div *ngIf="control.status === 'PENDING' " class="fa fa-spinner fa-spin loader"></div> <!--status of a request is pending-->
    <label for="floatingInput">{{label}}</label>
    <div *ngIf="control.errors?.['required']"  class="invalid-feedback">Please enter your {{label}}</div>
    <div *ngIf="control.errors?.['email']"  class="invalid-feedback">Please input a valid email address</div>
    <div *ngIf="control.errors?.['pattern']"  class="invalid-feedback">Password not comlex enough</div>
    <div *ngIf="control.errors?.['emailExists']"  class="invalid-feedback">this Email address is taken</div>
</div>
